name: SHQueueCommands
version: '${project.version}'
main: org.Cry_Legende.sHQueueCommands.SHQueueCommands
api-version: '1.20'
author: Cry_Legende
description: Met en file d'attente les commandes pour les joueurs hors ligne.

commands:
  queuecommand:
    description: Met en file d'attente une commande pour un joueur ou l'exécute directement.
    usage: /<command> queue <Joueur> <Commande ...>
    aliases: [qc, shqc, shqueuecommand]
    permission: shqueuecommands.execute

permissions:
  shqueuecommands.execute:
    description: Permet d'utiliser la commande pour mettre en file d'attente les commandes.
    default: true
