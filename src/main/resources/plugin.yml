name: SHQueueCommands
version: '${project.version}'
main: org.Cry_Legende.sHQueueCommands.SHQueueCommands
api-version: '1.20'
author: Cry_Legende
description: Met en file d'attente les commandes pour les joueurs hors ligne.
# Démarre avant l'ancien QueueCommands (2019, gardé pour livrer ses vieilles files) : le premier plugin activé
# prend l'alias /qc, utilisé par VoteParty, SHHypeVotes et CombatLogX (« qc queue ... »).
loadbefore: [QueueCommands]
# SHNetwork est facultatif : sans lui, la file reste celle de ce serveur (queued_commands.yml).
softdepend: [SHNetwork]
# Chargées par Paper dans le classloader du plugin : seul le mode réseau (file en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shqueuecommands:
    description: Met en file d'attente une commande pour un joueur ou l'exécute directement, et administre la file.
    usage: /<command> <queue|reload|list|clear>
    aliases: [queuecommand, qc, shqc, shqueuecommand]
    # Une sous-commande se délègue seule : la commande est ouverte à qui a l'un de ces droits
    permission: shqueuecommands.execute;shqueuecommands.admin.reload;shqueuecommands.admin.list;shqueuecommands.admin.clear

permissions:
  shqueuecommands.execute:
    description: Permet d'utiliser la commande pour mettre en file d'attente les commandes.
    # op : la commande s'exécute en console, un joueur ne doit jamais l'avoir par défaut
    default: op
  shqueuecommands.admin:
    description: Toute l'administration de la file (hors shqueuecommands.execute).
    default: op
    children:
      shqueuecommands.admin.reload: true
      shqueuecommands.admin.list: true
      shqueuecommands.admin.clear: true
  shqueuecommands.admin.reload:
    description: Recharger config.yml et messages.yml.
    default: op
  shqueuecommands.admin.list:
    description: Consulter les commandes en attente.
    default: op
  shqueuecommands.admin.clear:
    description: Retirer les commandes en attente d'un joueur.
    default: op
