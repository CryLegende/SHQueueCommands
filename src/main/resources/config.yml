# SHQueueCommands
#
# Met en file d'attente les commandes destinées aux joueurs hors ligne : elles sont exécutées en console à leur prochaine connexion.
# Les commandes qui attendent depuis trop longtemps sont purgées de la file (voir purge-after-days).
#
# Commandes (alias /qc, /shqc, /shqueuecommand) :
#   /queuecommand queue <Joueur> <Commande ...>   Exécute la commande tout de suite si le joueur est en ligne, sinon la met en file.
#   /queuecommand reload                          Recharge config.yml et messages.yml.
#
# Permissions :
#   shqueuecommands.execute   Utiliser /queuecommand (op par défaut : la commande s'exécute en console).
#   shqueuecommands.reload    Utiliser /queuecommand reload (op par défaut).

# Délai en ticks entre la connexion d'un joueur et l'exécution de ses commandes en file (20 ticks = 1 seconde).
# 0 exécute instantanément, déconseillé si d'autres plugins modifient les données du joueur à la connexion.
execution-delay-ticks: 100

# Nombre de jours pendant lesquels une commande reste en file avant d'être supprimée sans être exécutée.
# La purge s'exécute au démarrage, toutes les heures et à /queuecommand reload. 0 la désactive.
purge-after-days: 90

# Mode réseau : avec SHNetwork, une seule file pour tous les serveurs, en MariaDB (table shqc_queue).
# Joueur connecté sur un autre serveur : la commande y est exécutée tout de suite. Joueur hors ligne : la commande
# attend dans la file commune et part, une seule fois, sur le serveur où il se connecte. La purge ne tourne que sur
# un serveur. Au premier démarrage en mode réseau, queued_commands.yml de ce serveur est repris une fois pour tout
# le réseau ; chaque serveur renomme ensuite le sien en queued_commands.yml.avant-reseau.
# Si la base est injoignable, le plugin se désactive sur ce serveur (jamais de retour au fichier local).
# Sans SHNetwork, cette section ne sert pas.
reseau:
  actif: true
  # Canal du bus SHNetwork : prévient le serveur d'un joueur qu'une commande vient d'arriver pour lui
  canal: shqueuecommands
  # Table des premières connexions (SHPlayerTrack) : un joueur jamais venu sur ce serveur y est cherché avant
  # d'être déclaré introuvable. Vide pour ne pas la consulter.
  table-premieres-connexions: "Global.sh_track_firstseen"
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shqueuecommands
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes
    delai-ms: 3000
